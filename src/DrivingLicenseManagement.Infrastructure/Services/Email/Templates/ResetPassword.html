<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset your password — DVLD</title>
</head>

<body style="margin:0;padding:0;background-color:#F1F3F8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#131A2E;">

  <table width="100%" cellpadding="0" cellspacing="0"
        style="background-color:#F1F3F8;padding:40px 16px;">
    <tr>
      <td align="center">

        <table width="100%" cellpadding="0" cellspacing="0"
              style="max-width:560px;">

          <!-- Header -->
          <tr>
            <td style="background-color:#1B2759;border-radius:12px 12px 0 0;padding:32px 40px;text-align:center;">
              <h2 style="margin:0;color:#ffffff;font-size:26px;">
                DVLD
              </h2>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="background-color:#ffffff;padding:40px 40px 32px;border-left:1px solid #DDE1EA;border-right:1px solid #DDE1EA;">

              <h1 style="margin:0 0 10px;font-size:22px;font-weight:700;color:#131A2E;">
                Reset your password
              </h1>

              <p style="margin:0 0 28px;font-size:15px;color:#5A6480;line-height:1.6;">
                We received a request to reset your DVLD account password.
                Click the button below to choose a new password.
              </p>

              <!-- Reset Password Button -->
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <a href="{{ResetUrl}}"
                        style="display:inline-block;background-color:#1B2759;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:14px 40px;border-radius:8px;">
                      Reset Password
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#FAFBFD;border:1px solid #DDE1EA;border-top:none;border-radius:0 0 12px 12px;padding:20px 40px;text-align:center;">

              <p style="margin:0;font-size:12px;color:#98A1B8;line-height:1.8;">
                If you didn't request a password reset, you can safely ignore this email.
                <br />
                &copy; {{Year}} DVLD. All rights reserved.
              </p>

            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
