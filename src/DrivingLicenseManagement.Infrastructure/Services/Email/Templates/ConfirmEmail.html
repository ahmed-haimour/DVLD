<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify your email — DVLD</title>
</head>
<body style="margin:0;padding:0;background-color:#F1F3F8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#131A2E;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#F1F3F8;padding:40px 16px;">
    <tr>
     <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
          <tr>
            <td style="background-color:#1B2759;border-radius:12px 12px 0 0;padding:32px 40px;text-align:center;">
              <h2 style="margin:0;color:#ffffff;font-size:26px;">DVLD</h2>
            </td>
          </tr>
          <tr>
            <td style="background-color:#ffffff;padding:40px;border-left:1px solid #DDE1EA;border-right:1px solid #DDE1EA;text-align:center;">
              <h1 style="margin:0 0 12px;font-size:22px;color:#131A2E;">Verify your email</h1>
              <p style="margin:0 0 24px;font-size:15px;color:#5A6480;line-height:1.6;">
                Enter this code in DVLD to verify your email address. It expires in 10 minutes.
              </p>
              <div style="display:inline-block;background-color:#F1F3F8;border:1px solid #DDE1EA;border-radius:8px;padding:16px 28px;font-size:30px;font-weight:700;letter-spacing:8px;color:#1B2759;">
                {{VerificationCode}}
              </div>
            </td>
          </tr>
          <tr>
            <td style="background-color:#FAFBFD;border:1px solid #DDE1EA;border-top:none;border-radius:0 0 12px 12px;padding:20px 40px;text-align:center;">
              <p style="margin:0;font-size:12px;color:#98A1B8;line-height:1.8;">
                If you didn't create a DVLD account, you can safely ignore this email.<br />
                &copy; {{Year}} DVLD. All rights reserved.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
