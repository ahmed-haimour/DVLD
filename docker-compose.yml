services:
  dvld.api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dvld.api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,${MSSQL_PORT:-1433};Database=${MSSQL_DATABASE:-DrivingLicenseDB};User Id=${MSSQL_USER};Password=${MSSQL_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      - Resend__ApiKey=${RESEND_API_KEY}
    # Docker Desktop resolves host.docker.internal on its own; the mapping is declared
    # explicitly so the container also reaches the Windows host under plain Docker Engine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      dvld.seq:
        condition: service_started
    networks:
      - dvld-network

  dvld.seq:
    image: datalust/seq:latest
    container_name: dvld.seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "8081:80"
      - "5341:5341"
    volumes:
      - dvld-seq-data:/data
    networks:
      - dvld-network

networks:
  dvld-network:
    external: true

volumes:
  dvld-seq-data:
