services:
  dvld.api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dvld.api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=dvld-sql;Database=DrivingLicenseDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
    depends_on:
      dvld-sql:
        condition: service_healthy
      dvld.seq:
        condition: service_started
    networks:
      - dvld-network

  dvld-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dvld-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - dvld-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dvld-network

  dvld.seq:
    image: datalust/seq:latest
    container_name: dvld.seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "8081:80"
      - "5341:5341"
    volumes:
      - dvld-seq-data:/data
    networks:
      - dvld-network

networks:
  dvld-network:
    external: true

volumes:
  dvld-sql-data:
  dvld-seq-data:
